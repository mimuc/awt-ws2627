<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Counter - React</title>
    <!-- Basic react features (React 18 is the last version with these browser builds) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <!-- Babel is necessary for syntactic sugar (JSX) and nicer code -->
    <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; }
      .header h1 { color: #fff; background: #2b6cd4; padding: .4em 1em; border-radius: 6px 6px 0 0; margin: 0; }
      .counter { text-align: center; font-size: 2rem; padding: 1rem; }
      .counter button { font-size: 1.2rem; width: 3rem; margin: .5rem; color: #fff; background: #e53935; border: 0; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div> <!-- This will be filled by our script -->
    <script type="text/babel">
      const { useState } = React;

      function Counter() {
        const [count, setCount] = useState(0);
        return (
          <div className="counter">
            <span>{count}</span>
            <div>
              <button onClick={() => setCount((c) => c + 1)}>+</button>
              <button onClick={() => setCount((c) => c - 1)}>-</button>
            </div>
          </div>);
      }

      function App() {
        return (
          <div className="app">
            <div className="header">
              <h1>Counter - React</h1>
            </div>
            <Counter />
          </div>);
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
